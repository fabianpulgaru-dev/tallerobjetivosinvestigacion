.goal{font-family:'Space Grotesk';font-size:22px;line-height:1.55}.goal mark{padding:2px 5px;border-radius:6px}.v{background:var(--primarySoft);color:#5732E8}.q{background:var(--cyanSoft);color:var(--cyan)}.c{background:var(--yellowSoft);color:var(--yellow)}

.qtop{display:flex;justify-content:space-between;gap:8px;margin-bottom:13px}.qbadge{background:var(--primarySoft);color:var(--primary);border-radius:999px;padding:6px 9px;font-size:10.5px;font-weight:800}.qcount{font-size:10.5px;color:var(--muted);font-weight:800}
.context{background:var(--soft);border-radius:13px;padding:12px 14px;font-size:12.5px;line-height:1.5;margin-bottom:12px}.qtext{font-family:'Space Grotesk';font-size:24px;line-height:1.35;margin:0 0 14px}
.options{display:grid;gap:9px}.opt{border:1.5px solid var(--border);border-radius:12px;padding:13px 14px;background:#fff;text-align:left;font-weight:700;display:flex;gap:10px}.letter{width:24px;height:24px;border-radius:7px;background:var(--soft);display:grid;place-items:center;font-size:10px;flex:0 0 auto}.opt.correct{border-color:#94C6A6;background:var(--limeSoft)}

.leader{display:grid;gap:7px;margin-top:10px}.rank{display:grid;grid-template-columns:32px 1fr 75px;gap:7px;align-items:center;background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px 10px}.rank .pos{color:var(--primary);font-weight:800}.rank .pts{text-align:right;font-size:10.5px;font-weight:800}

/* ===== Visualización del proceso de investigación ===== */
.processMap{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0 18px}
.processStep{position:relative;padding:12px 10px;border:1px solid var(--line);border-radius:16px;background:#fff;min-height:88px}
.processStep:not(:last-child):after{content:"→";position:absolute;right:-12px;top:32px;z-index:2;font-weight:900;color:var(--purple)}
.processStep .ico{font-size:22px;display:block;margin-bottom:6px}.processStep b{display:block;font-size:13px}.processStep span{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.processStep.active{background:var(--purpleSoft);border-color:#bba7ff;box-shadow:0 8px 22px rgba(107,70,255,.10)}
.conceptCompare{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:10px;align-items:stretch;margin:14px 0}
.conceptBox{border:1px solid var(--line);border-radius:18px;padding:16px;background:#fff}.conceptBox .bigIco{font-size:28px}.conceptBox b{display:block;margin:7px 0 5px}.conceptBox p{margin:0;color:var(--muted);font-size:13px}
.notEq{display:grid;place-items:center;font-size:24px;font-weight:900;color:var(--muted)}
.anatomy{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0}.atom{padding:12px 14px;border-radius:14px;font-weight:850;border:1px solid var(--line)}.atom.action{background:var(--purpleSoft)}.atom.what{background:var(--cyanSoft)}.atom.bound{background:var(--limeSoft)}.plus{font-weight:950;color:var(--muted)}
.flowExplain{display:grid;grid-template-columns:1fr 42px 1fr 42px 1fr;gap:8px;align-items:center;margin:14px 0}.flowNode{padding:15px;border-radius:18px;border:1px solid var(--line);background:#fff;min-height:104px}.flowNode b{display:block;margin:5px 0}.flowArrow{font-size:25px;text-align:center;color:var(--purple);font-weight:900}
.transform{display:grid;grid-template-columns:1fr 48px 1.15fr;gap:12px;align-items:center;margin-top:12px}.transform .before,.transform .after{padding:16px;border-radius:18px;border:1px solid var(--line)}.transform .before{background:#fff3ee}.transform .after{background:var(--limeSoft)}.transform .arrow{font-size:28px;text-align:center;color:var(--purple);font-weight:900}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:end;margin:20px auto;max-width:760px}.podiumCard{border:1px solid var(--line);border-radius:22px;padding:18px;text-align:center;background:#fff;box-shadow:var(--shadow)}.podiumCard.first{padding-top:30px;background:linear-gradient(180deg,#fff8d8,#fff)}.podiumCard .medal{font-size:34px}.podiumCard h3{margin:7px 0 3px}.podiumCard .score{font-size:13px;color:var(--muted);font-weight:800}
.finalWinner{background:linear-gradient(135deg,#171A2B,#424867);color:#fff;border-radius:28px;padding:28px;text-align:center}.finalWinner .trophy{font-size:48px}.finalWinner h2{font-size:34px;margin:8px 0}
@media(max-width:760px){.processMap{grid-template-columns:1fr 1fr}.processStep:not(:last-child):after{display:none}.conceptCompare,.flowExplain,.transform,.podium{grid-template-columns:1fr}.notEq,.flowArrow,.transform .arrow{transform:rotate(90deg)}}


/* ===== Ajustes para proyección y navegación docente ===== */
#stage{padding-bottom:92px}.head{max-width:1060px;margin-bottom:25px}.head h2{font-size:clamp(30px,3vw,43px);line-height:1.1;margin:9px 0 13px}.head p{font-size:clamp(16px,1.35vw,20px);line-height:1.5;max-width:940px}.call{padding:20px;min-height:116px}.call b{font-size:17px}.call span{font-size:15px;line-height:1.45;margin-top:7px}.goal{font-size:19px;line-height:1.5;padding:18px}.card{padding:23px}.note{font-size:14px;line-height:1.5}

.gameHero{display:grid;grid-template-columns:1.2fr .8fr;gap:20px}.gameIntro{padding:29px;border-radius:27px;background:linear-gradient(135deg,#171A2B,#414766);color:#fff}.gameIntro h2{font-size:40px;line-height:1.05;margin:10px 0}.gameIntro p{font-size:17px;line-height:1.5;color:#eef0ff}.gameRules{display:grid;gap:9px}.rule{padding:15px;border:1px solid var(--border);border-radius:16px;background:#fff}.rule b{font-size:15px}.rule span{display:block;color:var(--muted);font-size:13px;line-height:1.42;margin-top:4px}
.oeFlow{display:grid;grid-template-columns:1fr 48px 1fr;gap:10px;align-items:center;margin:13px 0}.oeQuestion,.oeAnswer{padding:17px;border-radius:18px;border:1px solid var(--border);font-size:15px;line-height:1.45}.oeQuestion{background:#fff}.oeAnswer{background:var(--cyanSoft)}.oeArrow{text-align:center;font-size:25px;color:var(--primary);font-weight:900}.checkStrip{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:17px 0}.checkItem{padding:17px;border-radius:17px;border:1px solid var(--border);background:#fff}.checkItem b{font-size:16px}.checkItem span{display:block;font-size:14px;line-height:1.4;color:var(--muted);margin-top:5px}
@media(max-width:900px){.lessonDiagram,.gameHero,.oeFlow{grid-template-columns:1fr}.lessonArrow,.oeArrow{transform:rotate(90deg)}.checkStrip{grid-template-columns:1fr}.quickNav{left:12px;right:12px;transform:none}.head h2{font-size:30px}.head p{font-size:17px}}


/* ===== Modelado ampliado OG/OE ===== */
.exampleStack{display:grid;gap:13px;margin-top:18px}

<body><div id="root"></div>
<script>
const root=document.getElementById('root');
const STORE='ee2_objetivos_final_session_v1';
const QTIME=25;
const ROUNDS=[
{id:'r1',title:'Ronda 1 · ¿Está claro?',desc:'4 preguntas · reconoce si el objetivo se entiende bien.',questions:[
{type:'¿Está claro?',ctx:'Tema: juego libre durante la primera infancia.',q:'“Investigar el juego libre en niños y niñas.”',opts:['Está claro porque dice el tema que se investigará.','Hay que mejorarlo porque no dice con claridad qué se quiere hacer con ese tema.','Hay que mejorarlo porque todo objetivo debe comparar dos temas.'],correct:1,hint:'Pregúntate: ¿sé exactamente qué quieren hacer con el juego libre?',explain:'B. “Investigar” es muy amplio. Conviene decir con más claridad qué se quiere hacer: por ejemplo, describir las formas de juego libre.'},
{type:'¿Está claro?',ctx:'Tema: participación familiar en la adaptación.',q:'“Describir las formas de participación de las familias durante el proceso de adaptación al jardín infantil.”',opts:['Está claro: dice qué se hará, qué se observará y en qué situación.','Hay que mejorarlo porque debería explicar también los efectos de esa participación.','Hay que mejorarlo porque “describir” no sirve para un objetivo general.'],correct:0,hint:'¿Puedes reconocer qué harán y qué aspecto estudiarán?',explain:'A. El objetivo es claro: quiere describir las formas de participación familiar durante una situación concreta, la adaptación al jardín infantil.'},
{type:'¿Está claro?',ctx:'Tema: lectura compartida.',q:'“Conocer más sobre la lectura compartida en niños y niñas.”',opts:['Está claro porque “conocer más” indica que se quiere aprender sobre el tema.','Hay que mejorarlo porque debería decir qué aspecto de la lectura compartida quieren conocer.','Hay que mejorarlo porque debería proponer una actividad de lectura con los niños y niñas.'],correct:1,hint:'¿“Conocer más” te permite saber qué quieren observar o comprender?',explain:'B. “Conocer más” todavía es muy general. Hay que decir qué quieren conocer: por ejemplo, describir estrategias de lectura compartida o identificar sus características.'},
{type:'¿Está claro?',ctx:'Tema: juego simbólico y lenguaje.',q:'“Analizar la relación entre el juego simbólico y el desarrollo del lenguaje en niños y niñas de 3 a 5 años.”',opts:['Está claro porque indica qué relación se quiere estudiar y en quiénes.','Hay que mejorarlo porque juego y lenguaje deberían aparecer en objetivos separados.','Hay que mejorarlo porque debería explicar en el mismo objetivo cómo recogerán la información.'],correct:0,hint:'¿Se entiende qué quieren estudiar y en quiénes?',explain:'A. Se entiende con claridad que quieren estudiar la relación entre juego simbólico y lenguaje en niños y niñas de 3 a 5 años.'}
]},
{id:'r2',title:'Ronda 2 · Elige el más claro',desc:'4 preguntas · compara tres objetivos posibles.',questions:[
{type:'Elige el más claro',ctx:'Problema: queremos comprender cómo se relaciona el juego simbólico con el desarrollo del lenguaje en niños y niñas de 3 a 5 años.',q:'¿Qué objetivo responde mejor a ese problema?',opts:['Describir las formas de juego simbólico en niños y niñas de 3 a 5 años.','Analizar la relación entre el juego simbólico y el desarrollo del lenguaje en niños y niñas de 3 a 5 años.','Describir el desarrollo del lenguaje en niños y niñas de 3 a 5 años.'],correct:1,hint:'El problema habla de dos aspectos y de la relación entre ellos.',explain:'B. Es el único que mantiene los dos aspectos del problema y pregunta por la relación entre ellos.'},
{type:'Elige el más claro',ctx:'Problema: queremos comprender cómo la participación familiar se relaciona con la adaptación al jardín infantil.',q:'¿Qué objetivo responde mejor?',opts:['Describir las formas de participación de las familias durante la adaptación.','Analizar la relación entre participación familiar y adaptación de niños y niñas al jardín infantil.','Describir cómo viven niños y niñas sus primeras semanas en el jardín infantil.'],correct:1,hint:'¿Cuál conserva las dos partes del problema?',explain:'B. Mantiene tanto la participación familiar como la adaptación y propone estudiar cómo se relacionan.'},
{type:'Elige el más claro',ctx:'Problema: queremos comprender la relación entre el uso de pantallas y algunas conductas durante la primera infancia.',q:'¿Qué objetivo está mejor conectado con el problema?',opts:['Describir los principales usos de pantallas durante la primera infancia.','Analizar la relación entre el uso de pantallas y determinadas conductas infantiles durante la primera infancia.','Describir conductas frecuentes de niños y niñas durante la primera infancia.'],correct:1,hint:'Busca el objetivo que no deje fuera ninguna de las dos partes.',explain:'B. El problema quiere comprender una relación; por eso el objetivo debe mantener tanto el uso de pantallas como las conductas.'},
{type:'Elige el más claro',ctx:'Problema: queremos conocer las principales formas de juego al aire libre en niños y niñas de 3 a 5 años.',q:'¿Qué objetivo responde mejor?',opts:['Describir las principales formas de juego al aire libre en niños y niñas de 3 a 5 años.','Comparar el juego al aire libre con el juego en espacios interiores en niños y niñas de 3 a 5 años.','Analizar la relación entre juego al aire libre y bienestar en niños y niñas de 3 a 5 años.'],correct:0,hint:'No agregues una comparación o una relación que el problema no pidió.',explain:'A. El problema quiere conocer las formas de juego al aire libre; “describir” responde directamente a ese propósito.'}
]},
{id:'r3',title:'Ronda 3 · ¿Qué habría que mejorar?',desc:'3 preguntas · identifica el problema principal.',questions:[
{type:'¿Qué mejorarías?',ctx:'Objetivo: “Conocer más sobre la lectura compartida en niños y niñas de 4 a 5 años.”',q:'¿Qué habría que mejorar primero?',opts:['Cambiar “conocer más” por una acción que diga mejor qué se quiere saber.','Eliminar la edad porque hace que el objetivo sea demasiado específico.','Agregar otro tema para que el objetivo tenga dos aspectos.'],correct:0,hint:'¿Qué parte no te permite saber exactamente qué quieren hacer?',explain:'A. “Conocer más” es demasiado amplio. Un verbo como describir, identificar o analizar ayuda a expresar mejor qué se quiere conocer.'},
{type:'¿Qué mejorarías?',ctx:'Objetivo: “Analizar, describir, comparar, identificar y proponer estrategias sobre participación familiar.”',q:'¿Cuál es el principal problema?',opts:['Tiene demasiadas acciones juntas y no queda claro cuál es el propósito principal.','El tema de participación familiar es demasiado concreto para un objetivo general.','Todo objetivo general debería comenzar con el verbo “investigar”.'],correct:0,hint:'¿Es fácil reconocer qué quiere hacer principalmente esta investigación?',explain:'A. Hay demasiadas acciones juntas. Es mejor definir una acción principal y dejar otros pasos para los objetivos específicos.'},
{type:'¿Qué mejorarías?',ctx:'Objetivo: “Promover hábitos de lectura en las familias de niños y niñas de Educación Parvularia.”',q:'¿Qué problema tiene si queremos hacer una investigación?',opts:['Busca cambiar una práctica, en vez de expresar qué queremos comprender sobre ella.','Le falta indicar cuántas familias participarán en la investigación.','El tema debería ampliarse a todas las prácticas familiares y no solo a la lectura.'],correct:0,hint:'¿El objetivo busca comprender algo o producir un cambio?',explain:'A. “Promover” busca producir un cambio. Si el propósito es investigar, necesitamos expresar qué queremos conocer o comprender.'}
]},
{id:'r4',title:'Ronda 4 · Objetivos específicos claros',desc:'4 preguntas · reconoce pasos simples que ayudan a cumplir el objetivo general.',questions:[
{type:'Objetivos específicos',ctx:'OG: Analizar la relación entre juego al aire libre y desarrollo motor en niños y niñas de 3 a 5 años.',q:'¿Qué grupo de objetivos específicos ayuda mejor a cumplir ese objetivo general?',opts:['Describir las formas de juego al aire libre; describir aspectos del desarrollo motor; analizar cómo se relacionan ambos.','Describir las formas de juego al aire libre; comparar espacios interiores y exteriores; proponer nuevos juegos para el aula.','Describir el desarrollo motor; conocer juegos favoritos; diseñar actividades para niños y niñas.'],correct:0,hint:'Primero necesitamos comprender cada parte y luego volver a relacionarlas.',explain:'A. Los tres pasos ayudan directamente al objetivo general: conocer el juego, conocer el desarrollo motor y finalmente mirar la relación entre ambos.'},
{type:'Objetivos específicos',ctx:'OG: Analizar la relación entre lectura compartida y desarrollo del lenguaje oral.',q:'Ya tenemos: 1) Describir estrategias de lectura compartida. 2) Describir aspectos del lenguaje oral. ¿Qué falta?',opts:['Analizar cómo se relacionan la lectura compartida y el lenguaje oral.','Buscar artículos recientes sobre lectura compartida y lenguaje oral.','Diseñar una actividad de lectura compartida para aplicar en el aula.'],correct:0,hint:'Ya conocemos las dos partes. ¿Qué debemos hacer ahora para cumplir el objetivo general?',explain:'A. Falta volver a unir las dos partes y analizar cómo se relacionan. Buscar artículos o diseñar una actividad son tareas, no objetivos específicos.'},
{type:'Objetivos específicos',ctx:'OG: Analizar la relación entre participación familiar y adaptación al jardín infantil.',q:'¿Cuál de estos objetivos específicos se aleja del objetivo general?',opts:['Describir las formas de participación de las familias durante la adaptación.','Describir cómo se manifiesta la adaptación de niños y niñas al jardín infantil.','Describir la historia de los jardines infantiles en Chile.'],correct:2,hint:'¿Cuál no ayuda a comprender participación familiar, adaptación o la relación entre ambas?',explain:'C. La historia de los jardines infantiles puede ser interesante, pero no ayuda directamente a responder el objetivo general.'},
{type:'Objetivos específicos',ctx:'Un grupo quiere estudiar la participación familiar.',q:'¿Cuál opción es un objetivo específico y no una tarea?',opts:['Buscar artículos sobre participación familiar en una base de datos.','Identificar las principales formas de participación familiar descritas en los estudios revisados.','Ordenar los artículos encontrados en una tabla de trabajo.'],correct:1,hint:'¿Cuál expresa algo que queremos llegar a comprender?',explain:'B. “Identificar las principales formas…” expresa un conocimiento que queremos obtener. Buscar y ordenar artículos son tareas que ayudan a trabajar.'}
]}];
const TIES=[
{type:'Desempate',ctx:'Problema: queremos conocer las formas de participación infantil durante actividades grupales.',q:'¿Qué objetivo responde mejor?',opts:['Describir las formas de participación de niños y niñas durante actividades grupales.','Describir las estrategias que usan las educadoras para organizar actividades grupales.','Analizar la relación entre participación infantil y aprendizaje.'],correct:0,hint:'Mantén el mismo foco del problema.',explain:'A. El problema quiere conocer las formas de participación infantil; este objetivo mantiene exactamente ese foco.'},
{type:'Desempate',ctx:'OG: Describir las formas de juego simbólico en niños y niñas de 3 a 5 años.',q:'¿Qué objetivo específico aporta más directamente?',opts:['Identificar las principales características del juego simbólico descritas para niños y niñas de 3 a 5 años.','Comparar el juego simbólico con el juego al aire libre.','Diseñar actividades para fomentar el juego simbólico en el aula.'],correct:0,hint:'¿Cuál ayuda directamente a describir el juego simbólico?',explain:'A. Identificar sus características ayuda directamente a cumplir el objetivo general sin abrir otro tema.'},
{type:'Desempate final',ctx:'Objetivo inicial: “Saber más sobre la participación familiar.”',q:'¿Cuál es una reformulación más clara?',opts:['Describir las formas de participación familiar durante el proceso de adaptación al jardín infantil.','Comparar la participación familiar entre distintos establecimientos educativos.','Analizar la relación entre participación familiar y resultados de aprendizaje.'],correct:0,hint:'No agregues un nuevo problema que no estaba planteado.',explain:'A. Cambia “saber más” por una acción clara y agrega un contexto concreto sin inventar una nueva relación.'}
];

let role=null,peer=null,room='',connections=new Map(),students=new Map(),roundIndex=0,qIndex=0,currentQ=null,currentAnswers=new Map(),phase='idle',qStarted=0,timerInt=null,tieIndex=0,teacherPage=0;
const pages=['intro','bridge','whatIsObjective','objectiveFunction','model','generalExamples','rounds','quiz','specificIntro','specificFunction','specificModel','specificExamples','specificCheck','specificQuiz','podium','workshop','close'];

const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const initials=s=>(s||'?').trim().charAt(0).toUpperCase();
const code=()=> 'OBJ-'+Math.floor(100+Math.random()*900);
const icons=()=>window.lucide&&lucide.createIcons();

function saveTeacher(){
 const data={room,students:[...students.values()].map(s=>({name:s.name,score:s.score,answered:s.answered})),roundIndex,qIndex,tieIndex};
 try{localStorage.setItem(STORE,JSON.stringify(data))}catch(e){}
}
function downloadCSV(){
 const rows=[['Nombre','Puntaje','Respuestas enviadas'],...[...students.values()].sort((a,b)=>b.score-a.score).map(s=>[s.name,s.score,s.answered])];
 const csv=rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\n');
 const blob=new Blob(["\ufeff"+csv],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='resultados_objetivos.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)
}

function roleStart(){
 root.innerHTML=`<div class="roleStart"><div class="brandStart"><div class="brandIcon"><i data-lucide="target"></i></div><div><h1>Expresión Escrita II</h1><p>Objetivos de investigación · clase interactiva</p></div></div>
 <div class="welcome"><h2>Presentación + concurso en vivo</h2><p>Una sola herramienta para conducir la clase, proyectar las explicaciones y recibir respuestas desde celulares o computadores.</p></div>
 <div class="roleGrid"><button class="roleCard" onclick="teacherStart()"><div class="ico"><i data-lucide="presentation"></i></div><h3>Docente</h3><p>Crea una sala, controla la clase, revela respuestas, usa ruleta, ranking y desempates.</p></button>
 <button class="roleCard" onclick="studentJoinScreen()"><div class="ico"><i data-lucide="smartphone"></i></div><h3>Estudiante</h3><p>Entra solo con código de sala y nombre o apodo.</p></button></div>
 <div class="card" style="margin-top:15px"><b>Importante para la prueba:</b><p class="note">La conexión en vivo usa PeerJS, por lo que ambos dispositivos necesitan internet. Para una clase real conviene abrir este HTML desde una dirección web (Drive/SharePoint público, GitHub Pages, Netlify u otro hosting), no desde una ruta local.</p></div></div>`;icons()
}

function teacherStart(){
 role='teacher';room=code();
 root.innerHTML=`<header class="topbar"><div class="brand"><div class="ico"><i data-lucide="target"></i></div><div><h1>Objetivos de investigación</h1><small>Expresión Escrita II</small></div></div><div class="progressWrap"><div class="track"><i id="prog"></i></div><span class="ptxt" id="ptxt"></span></div><div class="roomPill"><span id="odot" class="onlineDot"></span>Sala <strong>${room}</strong> · <span id="scount">0</span></div></header><main class="teacherStage" id="stage"></main>`;
 setupTeacherPeer();renderTeacherPage();icons()
}
function setupTeacherPeer(){
 const cfg={debug:1,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]}};
 peer=new Peer('ee2-'+room.toLowerCase(),cfg);
 peer.on('open',()=>document.getElementById('odot')?.classList.add('on'));
 peer.on('disconnected',()=>{document.getElementById('odot')?.classList.remove('on');try{peer.reconnect()}catch(e){}});
 peer.on('connection',conn=>{
   connections.set(conn.peer,conn);
   conn.on('data',d=>teacherData(conn,d));
   conn.on('close',()=>{connections.delete(conn.peer);updateLive()});
   conn.on('error',()=>{connections.delete(conn.peer);updateLive()})
 });
 peer.on('error',e=>{const st=document.getElementById('stage');if(st&&!document.getElementById('peerErr'))st.insertAdjacentHTML('afterbegin',`<div class="errorMsg" id="peerErr">Problema de conexión (${esc(e.type)}). Mantén esta pestaña abierta y verifica Internet.</div>`)})
}
function teacherData(conn,d){
 if(!d||!d.type)return;
 if(d.type==='join'){
   let name=(d.name||'Estudiante').trim(),base=name,n=2;while(students.has(name))name=base+' '+n++;
   students.set(name,{name,peer:conn.peer,score:0,answered:0});conn.send({type:'joined',name,room});
   if(currentQ&&phase!=='idle') conn.send({type:'question',q:studentQ(currentQ),phase,start:qStarted,time:QTIME,round:roundIndex+1,index:qIndex+1,total:ROUNDS[roundIndex]?.questions.length||0});
   saveTeacher();updateLive()
 }
 if(d.type==='answer'&&phase==='open'){
   const s=[...students.values()].find(x=>x.peer===conn.peer);if(!s||currentAnswers.has(s.name))return;
   const ms=Date.now()-qStarted,ok=d.choice===currentQ.correct,bonus=ok?Math.max(0,Math.round(300*(1-Math.min(ms,QTIME*1000)/(QTIME*1000)))):0,pts=ok?1000+bonus:0;
   currentAnswers.set(s.name,{choice:d.choice,ms,ok,pts});s.score+=pts;s.answered++;saveTeacher();updateLive()
 }
}
const broadcast=o=>connections.forEach(c=>{try{c.open&&c.send(o)}catch(e){}});
const studentQ=q=>({type:q.type,ctx:q.ctx,q:q.q,opts:q.opts});

function renderTeacherPage(){
 const st=document.getElementById('stage');if(!st)return;
 let qn=document.getElementById('quickNavHost');if(!qn){qn=document.createElement('div');qn.id='quickNavHost';document.body.appendChild(qn)}qn.innerHTML=quickNav();document.getElementById('prog').style.width=((teacherPage+1)/pages.length*100)+'%';document.getElementById('ptxt').textContent=(teacherPage+1)+' / '+pages.length;
 const p=pages[teacherPage];
 if(p==='intro')st.innerHTML=intro();
 if(p==='bridge')st.innerHTML=bridge();
 if(p==='whatIsObjective')st.innerHTML=whatIsObjective();
 if(p==='objectiveFunction')st.innerHTML=objectiveFunction();
 if(p==='model')st.innerHTML=model();
 if(p==='generalExamples')st.innerHTML=generalExamples();
 if(p==='rounds')st.innerHTML=rounds();
 if(p==='quiz'){roundIndex=Math.min(roundIndex,2);qIndex=0;renderQuiz();return}
 if(p==='specificIntro')st.innerHTML=specificIntro();
 if(p==='specificFunction')st.innerHTML=specificFunction();
 if(p==='specificModel')st.innerHTML=specificModel();
 if(p==='specificExamples')st.innerHTML=specificExamples();
 if(p==='specificCheck')st.innerHTML=specificCheck();
 if(p==='specificQuiz'){roundIndex=3;qIndex=0;renderQuiz();return}
 if(p==='workshop')st.innerHTML=workshop();
 if(p==='podium')st.innerHTML=podiumPage();
 if(p==='close')st.innerHTML=closePage();
 icons()
}
const nav=()=>`<div class="footerNav"><button class="btn ghost" onclick="prevPage()">← Volver</button><button class="btn primary" onclick="nextPage()">Continuar →</button></div>`;
function nextPage(){teacherPage=Math.min(pages.length-1,teacherPage+1);renderTeacherPage()}function prevPage(){teacherPage=Math.max(0,teacherPage-1);renderTeacherPage()}


function goTo(section,round=null){
 if(section==='round'){teacherPage=pages.indexOf('quiz');roundIndex=round;qIndex=0;renderQuiz();return}
 teacherPage=pages.indexOf(section);renderTeacherPage()
}
function quickNav(){return `<div class="quickNav"><button onclick="goTo('intro')">⌂ Inicio</button><button onclick="goTo('bridge')">OG</button><button onclick="goTo('generalExamples')">Ejemplos OG</button><button onclick="goTo('round',0)">R1</button><button onclick="goTo('round',1)">R2</button><button onclick="goTo('round',2)">R3</button><button onclick="goTo('specificIntro')">OE</button><button onclick="goTo('specificExamples')">Ejemplos OE</button><button onclick="goTo('round',3)">R4</button><button onclick="goTo('podium')">Podio</button><button onclick="goTo('workshop')">Taller</button><button onclick="goTo('close')">Final</button></div>`}

function intro(){return `<div class="hero"><div class="ey">Clase 4 · Objetivos de investigación</div><h2>De una buena justificación a un objetivo claro</h2><p>Ya explicaron por qué su problema merece ser investigado. Ahora aprenderemos a decir con precisión <b>qué queremos lograr con esa investigación</b>.</p><div class="actions"><button class="btn white" onclick="nextPage()">Comenzar →</button></div></div>
<div class="card" style="margin-top:14px"><div class="grid3"><div class="call purple"><b>Sala</b><span>Código: <b style="color:var(--primary)">${room}</b></span></div><div class="call cyan"><b>Participantes</b><span><b id="introCount">${students.size}</b> conectadas/os.</span></div><div class="call lime"><b>Acceso</b><span>Sin correo. Solo código + nombre.</span></div></div></div>
<div class="card" style="margin-top:14px"><h3>Acceso desde celulares</h3><div class="qrWrap"><div class="qrBox"><canvas id="qr"></canvas></div><div class="urlBox"><p class="note">Si esta presentación está alojada en una URL pública, el QR abre directamente el modo estudiante con el código listo.</p><code id="shareUrl"></code><button class="btn secondary" onclick="copyShare()">Copiar enlace</button></div></div></div>`}
function bridge(){return `<div class="head"><span class="kicker">1 · Recuperamos lo que ya construimos</span><h2>La justificación nos dejó tres piezas clave</h2><p>Antes de escribir el objetivo, volvemos a esas decisiones. El objetivo no aparece de la nada: <b>nace del problema que ya justificamos</b>.</p></div><div class="lessonDiagram"><div class="lessonNode"><div class="cleanIcon">?</div><strong>Problema</strong><span>¿Qué situación necesita ser comprendida?</span></div><div class="lessonArrow">→</div><div class="lessonNode"><div class="cleanIcon">◎</div><strong>Foco</strong><span>¿Qué parte de esa situación nos interesa mirar?</span></div><div class="lessonArrow">→</div><div class="lessonNode"><div class="cleanIcon">+</div><strong>Aporte</strong><span>¿Por qué vale la pena producir conocimiento sobre esto?</span></div></div><div class="goal"><b>Puente hacia hoy:</b> si la justificación explicó <b>por qué importa investigar</b>, el objetivo debe expresar <b>qué haremos para comprender ese problema</b>.</div>${nav()}`}

function model(){return `<div class="head"><span class="kicker">4 · Construimos el objetivo general</span><h2>Tres decisiones para formularlo</h2><p>No buscamos llenar una fórmula. Estas preguntas nos ayudan a comprobar que el objetivo sea claro y suficientemente delimitado.</p></div><div class="checkStrip"><div class="checkItem" style="background:var(--primarySoft)"><b>1 · Acción</b><span>¿Qué operación intelectual realizaremos?</span></div><div class="checkItem" style="background:var(--cyanSoft)"><b>2 · Foco</b><span>¿Qué fenómeno, aspecto o relación estudiaremos?</span></div><div class="checkItem" style="background:var(--limeSoft)"><b>3 · Delimitación</b><span>¿En quiénes, dónde o en qué contexto?</span></div></div><div class="card" style="margin-top:22px"><span class="kicker">Transformación</span><div class="transform"><div class="before"><b>Muy amplio</b><p style="font-size:19px">“Investigar el juego libre en niños y niñas”.</p><span class="note">No precisa la operación y el foco sigue abierto.</span></div><div class="arrow">→</div><div class="after"><b>Más claro</b><p style="font-size:19px"><mark class="v">Describir</mark> <mark class="q">las formas de juego libre</mark> <mark class="c">que desarrollan niños y niñas de 3 a 5 años durante experiencias pedagógicas en Educación Parvularia</mark>.</p></div></div></div><div class="goal" style="margin-top:18px"><b>Chequeo final:</b> además de estar bien formulado, debe responder al problema que el grupo justificó.</div>${nav()}`}
function generalExamples(){return `<div class="head"><span class="kicker">5 · Miramos varios casos</span><h2>Un mismo criterio, distintos problemas</h2><p>No queremos memorizar una frase modelo. Queremos aprender a reconocer cómo cambian la <b>acción</b>, el <b>foco</b> y la <b>delimitación</b> según lo que el grupo necesita comprender.</p></div><div class="exampleStack">

<div class="exampleCase"><div class="tag">Lectura</div><div class="exbody"><b>Caracterizar las estrategias de lectura compartida utilizadas con niños y niñas de Educación Parvularia.</b><div class="miniFormula"><span class="a">Caracterizar</span><span class="f">estrategias de lectura compartida</span><span class="d">Educación Parvularia</span></div></div></div>
<div class="exampleCase"><div class="tag">Pantallas</div><div class="exbody"><b>Analizar la relación entre el uso de pantallas y determinadas conductas infantiles durante la primera infancia.</b><div class="miniFormula"><span class="a">Analizar</span><span class="f">uso de pantallas ↔ conductas</span><span class="d">primera infancia</span></div></div></div>
<div class="exampleCase"><div class="tag">Juego exterior</div><div class="exbody"><b>Describir las principales formas de juego al aire libre desarrolladas por niños y niñas de 3 a 5 años.</b><div class="miniFormula"><span class="a">Describir</span><span class="f">formas de juego al aire libre</span><span class="d">3 a 5 años</span></div></div></div>
</div><div class="goal" style="margin-top:18px"><b>Lo importante:</b> el verbo no se elige porque “suene académico”. Se elige porque expresa la operación que necesitamos realizar para responder al problema.</div>${nav()}`}

function rounds(){return `<div class="gameHero"><div class="gameIntro"><div class="ey">Concurso de objetivos de investigación</div><h2>Objetivo en la mira</h2><p><b>Objetivo:</b> reconocer, evaluar y mejorar objetivos de investigación aplicando los criterios que acabamos de aprender.</p><p>Las alternativas están diseñadas para obligarnos a mirar la <b>coherencia</b>, no solo a escoger la frase más larga.</p></div><div class="gameRules"><div class="rule"><b>1 · Lee</b><span>Primero tendrás 3,5 segundos de lectura.</span></div><div class="rule"><b>2 · Decide</b><span>Elige una de tres alternativas desde tu dispositivo.</span></div><div class="rule"><b>3 · Argumenta</b><span>Podemos discutir antes de revelar.</span></div><div class="rule"><b>4 · Aprende</b><span>Revelamos y analizamos el criterio.</span></div></div></div><div class="roundCards" style="margin-top:20px"><div class="roundCard"><div class="rn">4</div><h4>R1 · Reconocer</h4><p>Evaluar formulaciones.</p></div><div class="roundCard"><div class="rn">4</div><h4>R2 · Elegir</h4><p>Distinguir alternativas plausibles.</p></div><div class="roundCard"><div class="rn">3</div><h4>R3 · Diagnosticar</h4><p>Detectar el ajuste prioritario.</p></div><div class="roundCard"><div class="rn">4</div><h4>R4 · Específicos</h4><p>Coherencia OG/OE.</p></div></div><div class="footerNav"><button class="btn ghost" onclick="prevPage()">← Volver</button><button class="btn primary" onclick="teacherPage=pages.indexOf('quiz');roundIndex=0;qIndex=0;renderQuiz()">Comenzar «Objetivo en la mira» →</button></div>`}
function renderQuiz(tie=false){
 clearInterval(timerInt);currentQ=tie?TIES[tieIndex]:ROUNDS[roundIndex].questions[qIndex];phase='idle';currentAnswers.clear();
 document.getElementById('stage').innerHTML=`<div class="head"><span class="kicker">${tie?'Desempate':ROUNDS[roundIndex].title}</span><h2>${currentQ.type}</h2><p>${tie?'Pregunta adicional':ROUNDS[roundIndex].desc}</p></div><div class="quizLayout"><div class="qcard"><div class="qtop"><span class="qbadge">${currentQ.type}</span><span class="qcount">${tie?'Extra '+(tieIndex+1):'Pregunta '+(qIndex+1)+' / '+ROUNDS[roundIndex].questions.length}</span></div><div class="context">${currentQ.ctx}</div><p class="qtext">${currentQ.q}</p><div class="options">${currentQ.opts.map((o,i)=>`<div class="opt" id="o${i}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${o}</span></div>`).join('')}</div><div class="actions"><button class="btn primary" onclick="openVote(${tie})">▶ Abrir</button><button class="btn secondary" onclick="document.getElementById('hint').classList.toggle('show')">💡 Pista</button><button class="btn secondary" onclick="spin()">🎡 Argumenta</button><button class="btn secondary" onclick="closeVote()">⏸ Cerrar</button><button class="btn primary" onclick="reveal()">👁 Revelar</button><button class="btn secondary" onclick="winner()">🏆 Ganadora</button></div><div class="helpPanel" id="hint">${currentQ.hint}</div><div class="explainPanel" id="exp"><b>Respuesta: ${String.fromCharCode(65+currentQ.correct)}</b><br>${currentQ.explain}</div></div>
<div class="liveCard"><h3>Respuestas del curso</h3><p>La distribución aparece sin marcar cuál es correcta.</p><div class="joined"><b><span id="rc">0</span> / ${students.size} respuestas</b><span>${students.size} conectadas/os</span></div><div class="responses" id="bars">${barHTML()}</div><div class="timerBox"><div class="timerLine"><span>Tiempo</span><span id="tsec">—</span></div><div class="timerTrack"><div class="timerBar" id="tbar"></div></div></div><div class="phase" id="pbox">Esperando que abras la votación.</div><div class="wheelBox" id="wheel"><div>🎡 Le toca argumentar a…</div><div class="wheelName" id="wname"></div></div><div class="winnerBox" id="win"></div></div></div>
<div class="footerNav">${tie?`<button class="btn ghost" onclick="prevTie()">← Desempate anterior</button><button class="btn primary" onclick="nextTie()">Siguiente desempate →</button>`:`<button class="btn ghost" onclick="prevQ()">← Pregunta anterior</button><button class="btn primary" onclick="nextQ()">Siguiente pregunta →</button>`}</div>`;icons();updateLive()
}
function barHTML(){return currentQ.opts.map((_,i)=>`<div class="resp"><b>${String.fromCharCode(65+i)}</b><div class="respTrack"><div class="respBar" id="rb${i}"></div></div><div class="n" id="rn${i}">0%</div></div>`).join('')}
function openVote(tie=false){
 phase='open';currentAnswers.clear();qStarted=Date.now();broadcast({type:'question',q:studentQ(currentQ),phase:'open',start:qStarted,time:QTIME,round:tie?'D':roundIndex+1,index:tie?tieIndex+1:qIndex+1,total:tie?TIES.length:ROUNDS[roundIndex].questions.length,minRead:3500});document.getElementById('pbox').textContent='Votación abierta';startTimer()
}
function startTimer(){
 clearInterval(timerInt);timerInt=setInterval(()=>{const e=(Date.now()-qStarted)/1000,remain=Math.max(0,QTIME-e),sec=document.getElementById('tsec'),bar=document.getElementById('tbar');if(sec)sec.textContent=Math.ceil(remain)+' s';if(bar)bar.style.width=(remain/QTIME*100)+'%';if(remain<=0){clearInterval(timerInt);if(phase==='open')closeVote()}},200)
}
function closeVote(){if(!currentQ)return;phase='closed';clearInterval(timerInt);broadcast({type:'phase',phase:'closed'});const p=document.getElementById('pbox');if(p)p.textContent='Votación cerrada · discutimos antes de revelar.'}
function reveal(){
 phase='reveal';
 const optionEls=[...document.querySelectorAll('.qcard .opt')];
 optionEls.forEach((e,i)=>{e.classList.remove('correct','wrong');e.classList.toggle('correct',i===currentQ.correct)});
 const exp=document.getElementById('exp');if(exp)exp.classList.add('show');
 const pb=document.getElementById('pbox');if(pb)pb.textContent='Respuesta revelada · analizamos el razonamiento.';
 broadcast({type:'reveal',correct:currentQ.correct,explain:currentQ.explain})
}
function spin(){const names=[...students.keys()],box=document.getElementById('wheel');box.classList.add('show');if(!names.length){document.getElementById('wname').textContent='Aún nadie';return}let n=0;const i=setInterval(()=>{document.getElementById('wname').textContent=names[Math.floor(Math.random()*names.length)];if(++n>18)clearInterval(i)},75)}
function winner(){
 const ok=[...currentAnswers.entries()].filter(([_,a])=>a.ok).sort((a,b)=>a[1].ms-b[1].ms),box=document.getElementById('win');box.classList.add('show');
 if(!ok.length){box.innerHTML='<div class="cup">🤔</div><h3>Sin ganadora</h3><p>Nadie respondió correctamente.</p>';broadcast({type:'winner',name:null});return}
 const [name,a]=ok[0],top=[...students.values()].sort((a,b)=>b.score-a.score).slice(0,5);box.innerHTML=`<div class="cup">🏆</div><h3>${esc(name)}</h3><p>Correcta más rápida · ${(a.ms/1000).toFixed(1)} s</p><div class="leader">${top.map((s,i)=>`<div class="rank"><div class="pos">${i+1}</div><div>${esc(s.name)}</div><div class="pts">${s.score}</div></div>`).join('')}</div>`;broadcast({type:'winner',name,score:a.pts,leader:top.map(s=>({name:s.name,score:s.score}))})
}
function updateLive(){if(!currentQ)return;const counts=Array(currentQ.opts.length).fill(0);currentAnswers.forEach(a=>counts[a.choice]++);const tot=currentAnswers.size;document.getElementById('rc')&&(document.getElementById('rc').textContent=tot);counts.forEach((c,i)=>{const p=tot?Math.round(c/tot*100):0;document.getElementById('rb'+i)&&(document.getElementById('rb'+i).style.width=p+'%');document.getElementById('rn'+i)&&(document.getElementById('rn'+i).textContent=p+'%')});document.getElementById('scount')&&(document.getElementById('scount').textContent=students.size);document.getElementById('introCount')&&(document.getElementById('introCount').textContent=students.size)}
function nextQ(){

function specificCheck(){return `<div class="head"><span class="kicker">Objetivos específicos · control de calidad</span><h2>Antes de cerrar, probamos el sistema completo</h2><p>No basta con que cada objetivo específico “suene bien”. Deben funcionar <b>como conjunto</b>.</p></div><div class="checkStrip"><div class="checkItem"><b>1 · ¿Aporta?</b><span>Cada OE debe producir una pieza necesaria para alcanzar el OG.</span></div><div class="checkItem"><b>2 · ¿Es conocimiento?</b><span>Debe expresar algo que queremos comprender, no una tarea del proceso.</span></div><div class="checkItem"><b>3 · ¿Hay secuencia?</b><span>El conjunto debe avanzar desde las partes hacia el propósito general.</span></div></div><div class="badGood"><div class="bad"><b>Conjunto que se dispersa</b><p>OG: analizar lectura compartida ↔ lenguaje.<br><br>OE1: describir lectura compartida.<br>OE2: conocer la historia de los cuentos infantiles.<br>OE3: diseñar una actividad de lectura.</p><span class="note">Solo el primero aporta directamente; los otros abren propósitos diferentes.</span></div><div class="arr">→</div><div class="good"><b>Conjunto coherente</b><p>OE1: caracterizar estrategias de lectura compartida.<br>OE2: describir dimensiones del lenguaje oral.<br>OE3: analizar las relaciones reportadas entre ambas.</p><span class="note">Las piezas permiten reconstruir el OG.</span></div></div><div class="goal"><b>Imagen mental:</b> piensa los OE como piezas de un rompecabezas. Si una pieza no ayuda a formar la imagen del objetivo general, probablemente sobra o necesita reformulación.</div>${nav()}`}

function workshop(){return `<div class="head"><span class="kicker">Taller</span><h2>Ahora transfieran el modelo a su propia investigación</h2><p>Volvemos al problema que cada grupo justificó. Primero formulen el objetivo general; después pregúntense qué necesitan comprender para alcanzarlo y recién entonces redacten los específicos.</p></div><div class="workshop"><div class="guide">${['Problema · ¿qué situación justificamos?','Foco · ¿qué queremos comprender?','Objetivo general · acción + qué + delimitación','Necesidades · ¿qué debemos comprender primero?','Objetivos específicos · transformamos esas necesidades'].map((x,i)=>`<div class="gstep"><div class="n">${i+1}</div><div class="txt"><b>${x.split(' · ')[0]}</b><span>${x.split(' · ')[1]}</span></div></div>`).join('')}</div><div class="writer"><div class="field"><label>Problema</label><textarea></textarea></div><div class="field"><label>Foco</label><textarea></textarea></div><div class="field"><label>Objetivo general</label><textarea></textarea></div><div class="field"><label>OE1</label><input></div><div class="field"><label>OE2</label><input></div><div class="field"><label>OE3 (si lo necesitan)</label><input></div></div></div>${nav()}`}
function podiumPage(){
 const top=[...students.values()].sort((a,b)=>b.score-a.score).slice(0,3);
 const medals=['🥇','🥈','🥉'];
 const cards=top.length?top.map((s,i)=>`<div class="podiumCard ${i===0?'first':''}"><div class="medal">${medals[i]}</div><h3>${esc(s.name)}</h3><div class="score">${s.score} puntos</div><p class="note">${i===0?'Mayor puntaje acumulado de la actividad':i===1?'Segundo lugar':'Tercer lugar'}</p></div>`).join(''):`<div class="card"><h3>Aún no hay resultados</h3><p>Cuando haya participantes con puntaje, aquí aparecerán los tres primeros lugares.</p></div>`;
 const champ=top[0];
 return `<div class="head"><span class="kicker">Cierre del concurso</span><h2>🏆 Podio de la actividad</h2><p>Cada pregunta pudo tener una ganadora por rapidez y precisión. Ahora miramos el desempeño acumulado de toda la actividad.</p></div>${champ?`<div class="finalWinner"><div class="trophy">🏆</div><div style="opacity:.72;font-weight:800;text-transform:uppercase;font-size:12px">Ganadora de la actividad</div><h2>${esc(champ.name)}</h2><p>${champ.score} puntos acumulados</p></div>`:''}<div class="podium">${cards}</div><div class="goal"><b>🥇🥈🥉 Tres primeros lugares:</b> el podio considera el puntaje acumulado durante el concurso. La ganadora de cada pregunta sigue apareciendo al revelar cada actividad.</div>${nav()}`
}
function closePage(){const top=[...students.values()].sort((a,b)=>b.score-a.score).slice(0,5);return `<div class="hero" style="background:linear-gradient(135deg,#171A2B,#424867)"><div class="ey">Cierre</div><h2>¿Podemos entender qué quiere investigar su grupo?</h2><p>Producto de la sesión: <b>1 objetivo general + al menos 2 objetivos específicos</b>.</p></div><div class="grid2" style="margin-top:14px"><div class="call lime"><b>¿Se entiende qué investigarán?</b><span>Sí / todavía no.</span></div><div class="call cyan"><b>¿Se relaciona con la justificación?</b><span>Sí / todavía no.</span></div><div class="call yellow"><b>¿Los específicos ayudan al general?</b><span>Sí / todavía no.</span></div><div class="call pink"><b>¿Promete demasiado?</b><span>Si es así, ajustamos.</span></div></div><div class="card" style="margin-top:14px"><h3>Ranking final</h3><div class="leader">${top.length?top.map((s,i)=>`<div class="rank"><div class="pos">${i+1}</div><div>${esc(s.name)}</div><div class="pts">${s.score}</div></div>`).join(''):'<p class="note">Aún no hay puntajes.</p>'}</div><div class="actions"><button class="btn warn" onclick="tieIndex=0;renderQuiz(true)">⚡ Desempate</button><button class="btn secondary" onclick="downloadCSV()">↓ Exportar resultados CSV</button></div></div>${nav()}`}
function nextTie(){if(tieIndex<TIES.length-1){tieIndex++;renderQuiz(true)}else{teacherPage=pages.indexOf('close');renderTeacherPage()}}function prevTie(){if(tieIndex>0){tieIndex--;renderQuiz(true)}}

function makeShareURL(){
 const u=new URL(location.href);u.search='';u.hash='';u.searchParams.set('mode','student');u.searchParams.set('room',room);return u.toString()
}
function renderQR(){
 const c=document.getElementById('qr'),u=makeShareURL();document.getElementById('shareUrl').textContent=u;
 if(window.QRCode&&c)QRCode.toCanvas(c,u,{width:150,margin:1},()=>{})
}
function copyShare(){navigator.clipboard.writeText(makeShareURL()).then(()=>alert('Enlace copiado.'))}

function studentJoinScreen(prefill=''){
 root.innerHTML=`<div class="studentApp"><div class="studentScreen"><div class="joinCard"><div class="brandStart" style="margin-bottom:14px"><div class="brandIcon"><i data-lucide="smartphone"></i></div><div><h1 style="font-size:20px">Entrar al concurso</h1><p>Sin correo ni contraseña</p></div></div><h2>Código de sala</h2><input class="input" id="jroom" value="${esc(prefill)}" placeholder="OBJ-427" autocapitalize="characters"><input class="input" id="jname" placeholder="Tu nombre o apodo"><button class="btn primary" style="width:100%;justify-content:center;margin-top:12px" onclick="joinRoom()">Entrar</button><div id="jerr"></div></div></div></div>`;icons()
}
let sName='',sScore=0,sConn=null,readInt=null,joinAttempts=0,joinTimer=null,joinedOk=false;
function joinRoom(){
 const r=document.getElementById('jroom').value.trim().toUpperCase(),name=document.getElementById('jname').value.trim();
 if(!r||!name){document.getElementById('jerr').innerHTML='<div class="errorMsg">Escribe código y nombre.</div>';return}
 room=r;sName=name;joinAttempts=0;joinedOk=false;clearTimeout(joinTimer);
 document.getElementById('jerr').innerHTML='<div class="phase">Buscando la sala…</div>';
 if(peer){try{peer.destroy()}catch(e){}}
 const cfg={debug:1,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]}};
 peer=new Peer(undefined,cfg);
 peer.on('open',()=>connectToTeacher(r,name));
 peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
 peer.on('error',e=>{if(joinedOk)return;if(['peer-unavailable','network','server-error','socket-error','socket-closed','disconnected'].includes(e.type)){scheduleJoinRetry(r,name);return}showJoinError('No pudimos conectar con la sala. Revisa el código y tu conexión.')})
}
function connectToTeacher(r,name){
 if(joinedOk||!peer||peer.destroyed)return;joinAttempts++;
 const el=document.getElementById('jerr');if(el)el.innerHTML='<div class="phase">Conectando con la sala… intento '+joinAttempts+'/8</div>';
 try{
  if(sConn){try{sConn.close()}catch(e){}}
  sConn=peer.connect('ee2-'+r.toLowerCase(),{reliable:true,serialization:'json'});
  let opened=false;
  const timeout=setTimeout(()=>{if(!opened&&!joinedOk){try{sConn.close()}catch(e){}scheduleJoinRetry(r,name)}},3500);
  sConn.on('open',()=>{opened=true;clearTimeout(timeout);sConn.send({type:'join',name})});
  sConn.on('data',studentData);
  sConn.on('error',()=>{clearTimeout(timeout);if(!joinedOk)scheduleJoinRetry(r,name)});
  sConn.on('close',()=>{clearTimeout(timeout);if(!joinedOk)scheduleJoinRetry(r,name)})
 }catch(e){scheduleJoinRetry(r,name)}
}
function scheduleJoinRetry(r,name){
 if(joinedOk)return;clearTimeout(joinTimer);
 if(joinAttempts>=8){showJoinError('No encontramos esa sala. Comprueba que el docente la tenga abierta y que el código sea correcto.');return}
 joinTimer=setTimeout(()=>connectToTeacher(r,name),900)
}
function showJoinError(msg){
 const el=document.getElementById('jerr');if(el)el.innerHTML='<div class="errorMsg">'+msg+'<br><button class="btn secondary" style="margin-top:9px" onclick="joinRoom()">Reintentar</button></div>'
}
function studentData(d){
 if(d.type==='joined'){joinedOk=true;clearTimeout(joinTimer);sName=d.name;studentWait()}
 if(d.type==='question')studentQuestion(d)
 if(d.type==='phase'&&d.phase==='closed')studentClosed()
 if(d.type==='reveal')studentReveal(d)
 if(d.type==='winner')studentWinner(d)
}
function shell(inner){root.innerHTML=`<div class="studentApp"><div class="studentTop"><div class="studentWho"><div class="avatar">${initials(sName)}</div><div><b>${esc(sName)}</b><span>Sala ${room}</span></div></div><div class="scorePill">${sScore} pts</div></div><div class="studentScreen">${inner}</div></div>`;icons()}
function studentWait(){shell(`<div class="studentWait"><div class="big">✨</div><h2>Ya estás dentro</h2><p>Espera a que se abra la siguiente pregunta.</p></div>`)}
function studentQuestion(d){
 shell(`<div class="studentQ"><div class="qtop"><span class="qbadge">Ronda ${d.round} · ${d.index}/${d.total}</span></div><div class="context">${d.q.ctx}</div><p class="qtext">${d.q.q}</p><div class="lockMsg" id="lock">Lee primero · responde en 3,5 s</div><div class="options">${d.q.opts.map((o,i)=>`<button class="opt" data-so="${i}" disabled><span class="letter">${String.fromCharCode(65+i)}</span><span>${o}</span></button>`).join('')}</div></div>`);
 clearInterval(readInt);const t=Date.now();readInt=setInterval(()=>{const r=Math.max(0,(d.minRead||3500)-(Date.now()-t)),m=document.getElementById('lock');if(m)m.textContent=r>0?'Lee primero · responde en '+(r/1000).toFixed(1)+' s':'¡Ahora!';if(r<=0){clearInterval(readInt);document.querySelectorAll('[data-so]').forEach(b=>{b.disabled=false;b.onclick=()=>sendAnswer(+b.dataset.so)})}},100)
}
function sendAnswer(choice){document.querySelectorAll('[data-so]').forEach(b=>{b.disabled=true;b.classList.toggle('chosen',+b.dataset.so===choice)});sConn?.send({type:'answer',choice});document.getElementById('lock').textContent='Respuesta enviada ✓'}
function studentClosed(){shell(`<div class="studentWait"><div class="big">💬</div><h2>Votación cerrada</h2><p>Ahora viene la discusión del curso.</p></div>`)}
function studentReveal(d){shell(`<div class="studentResult"><div class="icon">💡</div><h2>Respuesta ${String.fromCharCode(65+d.correct)}</h2><p>${d.explain}</p></div>`)}
function studentWinner(d){if(d.name===sName){sScore+=d.score||0;shell(`<div class="studentResult"><div class="icon">🏆</div><h2>¡Ganaste esta pregunta!</h2><p>Fuiste la respuesta correcta más rápida.</p><div class="scorePill" style="display:inline-block;margin-top:10px">+${d.score||0} pts</div></div>`)}else shell(`<div class="studentResult"><div class="icon">👏</div><h2>${d.name?esc(d.name)+' ganó esta pregunta':'Esta pregunta quedó sin ganadora'}</h2><p>${d.name?'Fue la respuesta correcta más rápida.':'No hubo respuestas correctas.'}</p></div>`)}

const params=new URLSearchParams(location.search);
if(params.get('mode')==='student')studentJoinScreen((params.get('room')||'').toUpperCase());else roleStart();

const obs=new MutationObserver(()=>{if(document.getElementById('qr'))setTimeout(renderQR,50)});obs.observe(root,{childList:true,subtree:true});
</script></body></html>
