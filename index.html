<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cargando Expresión Escrita II…</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;background:#F7F8FC;color:#171A2B;display:grid;place-items:center;min-height:100vh;margin:0}
#status{padding:24px;text-align:center}
</style>
</head>
<body>
<div id="status">Cargando actividad…</div>
<script>
(async()=>{
  // Versión original fijada: evita recursión después de reemplazar main/index.html.
  const ORIGINAL='https://raw.githubusercontent.com/fabianpulgaru-dev/tallerobjetivosinvestigacion/613a4ad85108aa58bb7be7041d5f5703c695a29a/index.html';
  try{
    let src=await (await fetch(ORIGINAL,{cache:'no-store'})).text();

    const oldTeacher=`function setupTeacherPeer(){
 peer=new Peer('ee2-'+room.toLowerCase());
 peer.on('open',()=>document.getElementById('odot')?.classList.add('on'));
 peer.on('connection',conn=>{connections.set(conn.peer,conn);conn.on('data',d=>teacherData(conn,d));conn.on('close',()=>{connections.delete(conn.peer);const hit=[...students.entries()].find(([k,s])=>s.peer===conn.peer);if(hit)students.delete(hit[0]);updateLive()})});
 peer.on('error',e=>{const st=document.getElementById('stage');if(st)st.insertAdjacentHTML('afterbegin',\`<div class="errorMsg">Problema de conexión: \${esc(e.type)}. Prueba recargando o usando otra red.</div>\`)})
}`;

    const newTeacher=`function setupTeacherPeer(){
 const peerId='ee2-'+room.toLowerCase();
 const cfg={debug:1,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]}};
 peer=new Peer(peerId,cfg);
 peer.on('open',()=>document.getElementById('odot')?.classList.add('on'));
 peer.on('disconnected',()=>{document.getElementById('odot')?.classList.remove('on');try{peer.reconnect()}catch(e){}});
 peer.on('connection',conn=>{
   connections.set(conn.peer,conn);
   conn.on('data',d=>teacherData(conn,d));
   conn.on('close',()=>{connections.delete(conn.peer);updateLive()});
   conn.on('error',()=>{connections.delete(conn.peer);updateLive()})
 });
 peer.on('error',e=>{
   const st=document.getElementById('stage');
   if(st&&!document.getElementById('peerErr'))st.insertAdjacentHTML('afterbegin',\`<div class="errorMsg" id="peerErr">Problema de conexión (\${esc(e.type)}). Mantén esta pestaña abierta y verifica Internet.</div>\`)
 })
}`;

    if(!src.includes(oldTeacher)) throw new Error('No se encontró el bloque docente esperado.');
    src=src.replace(oldTeacher,newTeacher);

    const start=src.indexOf("let sName='',sScore=0,sConn=null,readInt=null;");
    const end=src.indexOf("\\nfunction studentData(d){",start);
    if(start<0||end<0) throw new Error('No se encontró el bloque estudiante esperado.');

    const newStudent=`let sName='',sScore=0,sConn=null,readInt=null,joinAttempts=0,joinTimer=null,joinedOk=false;
function joinRoom(){
 const r=document.getElementById('jroom').value.trim().toUpperCase(),name=document.getElementById('jname').value.trim();
 if(!r||!name){document.getElementById('jerr').innerHTML='<div class="errorMsg">Escribe código y nombre.</div>';return}
 room=r;sName=name;joinAttempts=0;joinedOk=false;clearTimeout(joinTimer);
 document.getElementById('jerr').innerHTML='<div class="phase">Buscando la sala…</div>';
 if(peer){try{peer.destroy()}catch(e){}}
 const cfg={debug:1,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]}};
 peer=new Peer(undefined,cfg);
 peer.on('open',()=>connectToTeacher(r,name));
 peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
 peer.on('error',e=>{
   if(joinedOk)return;
   if(['peer-unavailable','network','server-error','socket-error','socket-closed','disconnected'].includes(e.type)){scheduleJoinRetry(r,name);return}
   showJoinError('No pudimos conectar con la sala. Revisa el código y tu conexión.')
 })
}
function connectToTeacher(r,name){
 if(joinedOk||!peer||peer.destroyed)return;
 joinAttempts++;
 const el=document.getElementById('jerr');
 if(el)el.innerHTML='<div class="phase">Conectando con la sala… intento '+joinAttempts+'/8</div>';
 try{
   if(sConn){try{sConn.close()}catch(e){}}
   sConn=peer.connect('ee2-'+r.toLowerCase(),{reliable:true,serialization:'json'});
   let opened=false;
   const timeout=setTimeout(()=>{if(!opened&&!joinedOk){try{sConn.close()}catch(e){}scheduleJoinRetry(r,name)}},3500);
   sConn.on('open',()=>{opened=true;clearTimeout(timeout);sConn.send({type:'join',name})});
   sConn.on('data',studentData);
   sConn.on('error',()=>{clearTimeout(timeout);if(!joinedOk)scheduleJoinRetry(r,name)});
   sConn.on('close',()=>{clearTimeout(timeout);if(!joinedOk)scheduleJoinRetry(r,name)})
 }catch(e){scheduleJoinRetry(r,name)}
}
function scheduleJoinRetry(r,name){
 if(joinedOk)return;
 clearTimeout(joinTimer);
 if(joinAttempts>=8){showJoinError('No encontramos esa sala. Comprueba que el docente la tenga abierta y que el código sea correcto.');return}
 joinTimer=setTimeout(()=>connectToTeacher(r,name),900)
}
function showJoinError(msg){
 const el=document.getElementById('jerr');
 if(el)el.innerHTML='<div class="errorMsg">'+msg+'<br><button class="btn secondary" style="margin-top:9px" onclick="joinRoom()">Reintentar</button></div>'
}`;

    src=src.slice(0,start)+newStudent+src.slice(end);
    src=src.replace(
      "if(d.type==='joined'){sName=d.name;studentWait()}",
      "if(d.type==='joined'){joinedOk=true;clearTimeout(joinTimer);sName=d.name;studentWait()}"
    );

    // Base URL: los enlaces relativos y la URL del QR deben seguir apuntando a GitHub Pages.
    const base='<base href="https://fabianpulgaru-dev.github.io/tallerobjetivosinvestigacion/">';
    src=src.replace('<head>','<head>'+base);

    document.open();
    document.write(src);
    document.close();
  }catch(err){
    document.getElementById('status').innerHTML='<b>No se pudo cargar la actividad.</b><br><small>'+String(err.message||err)+'</small>';
  }
})();
</script>
</body>
</html>
